<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Honcho's Entertainment | Social Sweeps</title>
    <style>
        :root { 
            --bg-main: #020208; 
            --panel-gold: #ffcc00; 
            --neon-blue: #00f0ff; 
            --neon-magenta: #ff007f; 
            --text-white: #ffffff; 
            --card-bg: #0d1127;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Arial Black', Gadget, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-white); padding-bottom: 95px; background-image: radial-gradient(circle at center, #0c1033 0%, #020208 100%); background-attachment: fixed; }
        
        /* Premium Sweepstakes App Header */
        header { 
            background: linear-gradient(180deg, #161c44 0%, #090d22 100%); 
            padding: 12px 15px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 3px solid var(--panel-gold); 
            box-shadow: 0 4px 20px rgba(255, 204, 0, 0.35); 
            position: sticky; top: 0; z-index: 100; 
        }
        .logo { font-size: 1.1rem; color: var(--panel-gold); text-shadow: 0 0 12px rgba(255, 204, 0, 0.8); letter-spacing: 1px; text-transform: uppercase; }
        
        /* High-Vibrancy Balance Displays linking to your Airtable */
        .wallet { display: flex; gap: 8px; }
        .coin-box { background: linear-gradient(180deg, #000000 0%, #111111 100%); padding: 6px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; border: 2px solid var(--neon-blue); display: flex; align-items: center; gap: 5px; box-shadow: 0 0 10px rgba(0, 240, 255, 0.2); }
        .coin-box.gc { border-color: var(--panel-gold); color: var(--panel-gold); box-shadow: 0 0 10px rgba(255, 204, 0, 0.2); }
        .coin-box.sc { border-color: var(--neon-magenta); color: var(--neon-magenta); box-shadow: 0 0 10px rgba(255, 0, 127, 0.2); }
        
        /* Promo Banner: \$25 Sign-On Bonus Notice */
        .promo-banner {
            background: linear-gradient(90deg, #ff007f 0%, #b000ff 50%, #ff007f 100%);
            color: #fff;
            padding: 10px;
            text-align: center;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(255, 0, 127, 0.4);
            border-bottom: 1px solid rgba(255,255,255,0.2);
            font-weight: 900;
        }
        .promo-highlight {
            color: var(--panel-gold);
            text-shadow: 0 0 8px rgba(255, 204, 0, 0.9);
        }

        /* Interactive Jackpot Counter Banner */
        .ticker-bar { background: rgba(0, 0, 0, 0.6); padding: 8px; text-align: center; font-size: 1rem; text-transform: uppercase; border-bottom: 1px solid rgba(255, 204, 0, 0.3); font-weight: bold; letter-spacing: 0.5px; }
        .jackpot-val { color: var(--neon-blue); font-size: 1.1rem; text-shadow: 0 0 10px rgba(0, 240, 255, 0.7); font-weight: 900; }

        .container { max-width: 1200px; margin: 20px auto; padding: 0 12px; }
        .menu-title { font-size: 1.1rem; margin-bottom: 15px; color: var(--neon-blue); text-transform: uppercase; letter-spacing: 1px; text-shadow: 0 0 5px rgba(0, 240, 255, 0.4); }
        
        /* Premium App Grid Layout */
        .lobby-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        @media (min-width: 768px) { .lobby-grid { grid-template-columns: repeat(4, 1fr); } }
        
        /* High-End Glossy App Cards (Like Chumba/MilkyWay) */
        .game-wrapper { background-color: var(--card-bg); border-radius: 12px; overflow: hidden; border: 2px solid #202b66; position: relative; transition: transform 0.15s ease, border-color 0.15s ease; cursor: pointer; aspect-ratio: 1 / 1; box-shadow: 0 8px 16px rgba(0,0,0,0.6); display: flex; flex-direction: column; }
        .game-wrapper:hover { transform: scale(1.03); border-color: var(--panel-gold); box-shadow: 0 0 15px rgba(255, 204, 0, 0.4); }
        
        /* Card Artwork Graphics Simulation Wrapper */
        .game-banner { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 2.8rem; position: relative; }
        .banner-1 { background: linear-gradient(135deg, #ff512f 0%, #dd2476 100%); }
        .banner-2 { background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%); }
        .banner-3 { background: linear-gradient(135deg, #f80759 0%, #bc4e9c 100%); }
        .banner-4 { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); }
        
        /* Glossy overlay effect found in premium apps */
        .game-banner::after { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 50%; background: linear-gradient(rgba(255,255,255,0.15), rgba(255,255,255,0)); pointer-events: none; }
        
        .game-name { position: absolute; bottom: 0; width: 100%; background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.95) 40%); padding: 12px 5px 8px 5px; text-align: center; font-size: 0.8rem; text-transform: uppercase; color: #fff; letter-spacing: 0.5px; font-weight: 900; }

        /* Fixed Navigation Tab Bar */
        .footer-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: linear-gradient(180deg, #090d22 0%, #040612 100%); display: flex; justify-content: space-around; align-items: center; padding: 12px 0; border-top: 2px solid var(--neon-blue); z-index: 100; box-shadow: 0 -4px 15px rgba(0,0,0,0.5); }
        .footer-btn { background: none; border: none; color: var(--text-white); font-size: 0.8rem; text-transform: uppercase; font-weight: bold; cursor: pointer; letter-spacing: 0.5px; }
        .action-buy { background: linear-gradient(180deg, #fff385 0%, #ffaa00 100%); color: #000; padding: 8px 24px; border-radius: 20px; box-shadow: 0 4px 12px rgba(255, 204, 0, 0.5); font-weight: 900; }
    </style>
</head>
<body>

    <header>
        <div class="logo">HONCHO'S ENT.</div>
        <div class="wallet">
            <div class="coin-box gc">GC: <span id="gc-balance">Loading...</span></div>
            <div class="coin-box sc">SC: <span id="sc-balance">Loading...</span></div>
        </div>
    </header>

    <!-- Legally Compliant Welcome Package Promotional Banner -->
    <div class="promo-banner">
        🎉 WELCOME BONUS: REGISTER TODAY FOR <span class="promo-highlight">\$25 FREE PLAY</span> COIN BALANCE! 🎉
    </div>

    <div class="ticker-bar">GLOBAL PROGRESSIVE JACKPOT: <span class="jackpot-val">\$1,842,905.10</span></div>

    <div class="container">
        <h2 class="menu-title">Featured Slots</h2>
        <div class="lobby-grid">
            <div class="game-wrapper" onclick="openSlot()"><div class="game-banner banner-1">🦁</div><div class="game-name">Wild Safari</div></div>
            <div class="game-wrapper" onclick="openSlot()"><div class="game-banner banner-2">⚡</div><div class="game-name">Volt Strike</div></div>
            <div class="game-wrapper" onclick="openSlot()"><div class="game-banner banner-3">🔮</div><div class="game-name">Mystic Fortune</div></div>
            <div class="game-wrapper" onclick="openSlot()"><div class="game-banner banner-4">🎰</div><div class="game-name">Neon Fruit Blast</div></div>
        </div>
    </div>

    <div class="footer-bar">
        <button class="footer-btn">Lobby</button>
        <button class="footer-btn action-buy">Store</button>
        <button class="footer-btn">Account</button>
    </div>

    <script>
        const testEmail = 'jehancho1234@gmail.com'; 

        // Clicking ANY game wrapper card now opens your active slot screen file
        function openSlot() {
            window.location.href = 'slot.html';
        }

        async function fetchBalances() {
            try {
                const response = await fetch(`/api/player/${testEmail}`);
                const data = await response.json();
                if(!data.error) {
                    document.getElementById('gc-balance').innerText = Number(data.goldCoins).toLocaleString();
                    document.getElementById('sc-balance').innerText = Number(data.sweepCoins).toFixed(2);
                } else {
                    document.getElementById('gc-balance').innerText = 'No User';
                    document.getElementById('sc-balance').innerText = 'No User';
                }
            } catch (err) {
                document.getElementById('gc-balance').innerText = 'Error';
                document.getElementById('sc-balance').innerText = 'Error';
            }
        }
        window.onload = fetchBalances;
    </script>
</body>
</html>
