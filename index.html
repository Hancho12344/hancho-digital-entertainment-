<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Honcho's Entertainment | Premium Sweeps Portal</title>
    <style>
        :root { 
            --bg-deep: #030511; 
            --gold-glow: #ffd700;
            --neon-blue: #00f0ff; 
            --neon-pink: #ff007f; 
            --card-border: rgba(255, 255, 255, 0.08);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', 'Arial Black', sans-serif; }
        
        body { 
            background-color: var(--bg-deep); 
            color: #ffffff; 
            padding-bottom: 100px; 
            background-image: 
                radial-gradient(circle at 50% 0%, #141938 0%, transparent 50%),
                radial-gradient(circle at 0% 100%, #0d0a21 0%, transparent 40%);
            background-attachment: fixed;
            overflow-x: hidden;
        }
        
        /* Premium Sleek Top Navigation Header */
        header { 
            background: linear-gradient(180deg, rgba(16, 22, 54, 0.95) 0%, rgba(6, 8, 20, 0.98) 100%); 
            backdrop-filter: blur(10px);
            padding: 14px 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 2px solid var(--gold-glow); 
            box-shadow: 0 4px 25px rgba(255, 215, 0, 0.25); 
            position: sticky; top: 0; z-index: 100; 
        }
        .logo { font-size: 1.2rem; font-weight: 900; color: var(--gold-glow); text-shadow: 0 0 15px rgba(255, 215, 0, 0.6); letter-spacing: 1.5px; text-transform: uppercase; }
        
        /* High-Gloss Currency Balance Plates */
        .wallet { display: flex; gap: 10px; }
        .coin-box { 
            background: linear-gradient(135deg, #02040a 0%, #0f1322 100%); 
            padding: 6px 14px; 
            border-radius: 30px; 
            font-size: 0.8rem; 
            font-weight: 800; 
            border: 1.5px solid var(--neon-blue); 
            display: flex; 
            align-items: center; 
            gap: 6px; 
            box-shadow: inset 0 0 8px rgba(0, 240, 255, 0.2), 0 0 10px rgba(0, 240, 255, 0.1); 
        }
        .coin-box.gc { border-color: var(--gold-glow); color: var(--gold-glow); box-shadow: inset 0 0 8px rgba(255, 215, 0, 0.2), 0 0 10px rgba(255, 215, 0, 0.1); }
        .coin-box.sc { border-color: var(--neon-pink); color: var(--neon-pink); box-shadow: inset 0 0 8px rgba(255, 0, 127, 0.2), 0 0 10px rgba(255, 0, 127, 0.1); }
        
        /* Dynamic Flashing Welcome Offer Strip */
        .promo-banner {
            background: linear-gradient(90deg, #ff0055 0%, #6e00ff 50%, #ff0055 100%);
            background-size: 200% auto;
            animation: gradientShift 4s linear infinite;
            color: #fff;
            padding: 10px;
            text-align: center;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            box-shadow: 0 4px 20px rgba(255, 0, 85, 0.4);
            font-weight: 900;
            border-bottom: 1px solid rgba(255,255,255,0.15);
        }
        .promo-highlight { color: var(--gold-glow); text-shadow: 0 0 8px rgba(255, 215, 0, 0.9); }

        @keyframes gradientShift { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }

        .ticker-bar { background: rgba(0, 0, 0, 0.4); padding: 8px; text-align: center; font-size: 0.9rem; text-transform: uppercase; border-bottom: 1px solid rgba(255, 255, 255, 0.05); letter-spacing: 1px; color: #a0a5c0; }
        .jackpot-val { color: var(--neon-blue); font-weight: 900; text-shadow: 0 0 12px rgba(0, 240, 255, 0.6); }

        .container { max-width: 1200px; margin: 25px auto; padding: 0 16px; }
        .menu-title { font-size: 1.1rem; font-weight: 800; margin-bottom: 20px; color: var(--neon-blue); text-transform: uppercase; letter-spacing: 1.5px; text-shadow: 0 0 8px rgba(0, 240, 255, 0.3); }
        
        /* Main Lobby 4-Column Presentation Grid */
        .lobby-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
        @media (min-width: 768px) { .lobby-grid { grid-template-columns: repeat(4, 1fr); } }
        
        /* Modern 3D Premium Glass Cabinets (No more emojis / kitty layouts) */
        .game-wrapper { 
            background: linear-gradient(135deg, #0d122e 0%, #060817 100%); 
            border-radius: 16px; 
            overflow: hidden; 
            border: 1px solid var(--card-border); 
            position: relative; 
            transition: all 0.25s cubic-bezier(0.25, 0.8, 0.25, 1); 
            cursor: pointer; 
            aspect-ratio: 4 / 5; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); 
            display: flex;
            flex-direction: column;
        }
        
        /* Animated neon tracking borders on interaction */
        .game-wrapper::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            border-radius: 16px; box-shadow: inset 0 0 0 2px transparent; transition: all 0.25s ease; pointer-events: none; z-index: 5;
        }
        .game-wrapper:hover { 
            transform: translateY(-6px) scale(1.02); 
            box-shadow: 0 15px 30px rgba(0, 240, 255, 0.15);
        }
        .game-wrapper:hover::before { box-shadow: inset 0 0 0 2px var(--neon-blue); }
        .game-wrapper.featured:hover::before { box-shadow: inset 0 0 0 2px var(--gold-glow); }
        
        /* Premium High-End Graphic Panels */
        .game-banner { 
            width: 100%; height: 100%; background-size: cover; background-position: center; position: relative; 
            display: flex; align-items: center; justify-content: center;
        }
        
        /* Seamless High-End Premium Background Art Replacements */
        .banner-1 { background-image: linear-gradient(to bottom, rgba(0,0,0,0.1), rgba(6,8,23,0.95)), url('https://unsplash.com'); }
        .banner-2 { background-image: linear-gradient(to bottom, rgba(0,0,0,0.1), rgba(6,8,23,0.95)), url('https://unsplash.com'); }
        .banner-3 { background-image: linear-gradient(to bottom, rgba(0,0,0,0.1), rgba(6,8,23,0.95)), url('https://unsplash.com'); }
        .banner-4 { background-image: linear-gradient(to bottom, rgba(0,0,0,0.1), rgba(6,8,23,0.95)), url('https://unsplash.com'); }
        
        /* High-gloss luxury light shine over the artwork */
        .game-banner::after { 
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: linear-gradient(135deg, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0) 50%); pointer-events: none; 
        }
        
        /* Clean Sleek Typography Block */
        .game-info { position: absolute; bottom: 0; width: 100%; padding: 15px 10px; text-align: center; z-index: 4; }
        .game-tag { font-size: 0.6rem; text-transform: uppercase; color: var(--neon-blue); letter-spacing: 2px; margin-bottom: 4px; font-weight: 800; }
        .game-wrapper.featured .game-tag { color: var(--gold-glow); }
        .game-name { font-size: 0.85rem; font-weight: 900; text-transform: uppercase; color: #ffffff; letter-spacing: 0.5px; }

        /* Modern Bottom Utility Dock Bar */
        .footer-bar { 
            position: fixed; bottom: 0; left: 0; width: 100%; 
            background: linear-gradient(180deg, rgba(13, 17, 43, 0.95) 0%, rgba(4, 6, 18, 0.98) 100%); 
            backdrop-filter: blur(12px);
            display: flex; justify-content: space-around; align-items: center; padding: 14px 0; 
            border-top: 1px solid rgba(255,255,255,0.05); z-index: 100; box-shadow: 0 -10px 30px rgba(0,0,0,0.6); 
        }
        .footer-btn { background: none; border: none; color: #a0a5c0; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; cursor: pointer; letter-spacing: 1px; transition: color 0.2s; }
        .footer-btn.active, .footer-btn:hover { color: #ffffff; }
        .action-buy { 
            background: linear-gradient(135deg, #ffd700 0%, #ffa500 100%); 
            color: #000000; padding: 10px 28px; border-radius: 30px; 
            box-shadow: 0 4px 15px rgba(255, 165, 0, 0.4); font-weight: 900; font-size: 0.8rem;
            border: none; transition: transform 0.1s;
        }
        .action-buy:active { transform: scale(0.96); }
    </style>
</head>
<body>

    <header>
        <div class="logo">HONCHO'S ENT.</div>
        <div class="wallet">
            <div class="coin-box gc">GC: <span id="gc-balance">Loading...</span></div>
            <div class="coin-box sc">SC: <span id="sc-balance">Loading...</span></div>
        </div>
    </header>

    <div class="promo-banner">
        🚀 PLAYER WELCOME: REGISTER NOW & UNLOCK YOUR <span class="promo-highlight">\$25 FREE PLAY</span> BALANCE 🚀
    </div>

    <div class="ticker-bar">LIVE PROGRESSIVE JACKPOT: <span class="jackpot-val">\$1,842,905.10</span></div>

    <div class="container">
        <h2 class="menu-title">Premium Games</h2>
        <div class="lobby-grid">
            <div class="game-wrapper featured" onclick="openSlot()"><div class="game-banner banner-1"></div><div class="game-info"><div class="game-tag">Featured Slot</div><div class="game-name">Wild Safari</div></div></div>
            <div class="game-wrapper" onclick="openSlot()"><div class="game-banner banner-2"></div><div class="game-info"><div class="game-tag">Slots</div><div class="game-name">Volt Strike</div></div></div>
            <div class="game-wrapper" onclick="openSlot()"><div class="game-banner banner-3"></div><div class="game-info"><div class="game-tag">Jackpot</div><div class="game-name">Mystic Fortune</div></div></div>
